<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampirish</title>
<!-- Fonts: Special Elite (typewriter) for the poem and title, Courier Prime for small labels. Both from Google Fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital@0;1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>


<!-- THE JIGGLE
     An invisible SVG that defines two filters. "wob" is the handwritten/redrawn effect:
       1. feTurbulence makes a field of random noise.
       2. feDisplacementMap uses that noise to push every pixel of the text a tiny bit sideways and up/down.
       3. The <animate> line changes the noise's "seed" in steps (calcMode="discrete"): 8 different seeds
          over 2 seconds = 4 new wobbles a second, matching the 4 fps animations. Because it steps instead of
          sliding, the text looks redrawn each time. It works on any font.
     "wobStill" is the same with a fixed seed, used for people who asked for reduced motion. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wob" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;6;11;3;8;14;5;9" dur="2s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobStill" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- The two layers for the floating words (see the CSS above); the JavaScript fills them -->
<div id="bg"></div>
<div id="fx"></div>

<!-- Title and counter. The counter's total is filled in by the JavaScript from the poem list. -->
<header>
  <h1>Vampir<span>ish</span></h1>
  <div class="count"><b id="cnt">0</b> of <span id="tot"></span> drawn <button class="again" id="again" hidden>Begin again</button></div>
</header>

<!-- The shelf: the JavaScript creates one button per panel inside this -->
<nav id="shelf" aria-label="Finished panels"></nav>

<!-- The stage: the picture (a canvas the JavaScript draws on) and the poem text -->
<main class="stage" id="stage">
  <div class="panel" id="panel"><canvas id="cv" width="800" height="800" aria-label="Animation panel"></canvas></div>
  <div>
    <div class="lines wob" id="lines"></div>
    <p class="note" id="note">Drag the word that finishes the line onto the picture.</p>
  </div>
</main>

<!-- All the code below runs the page. It is made of four parts, in order:
       1. the poem list, 2. the frame list and timing, 3. the picture player, 4. the interaction. -->
<script src="main.js"></script>

</body>
</html>
