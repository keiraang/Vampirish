<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampirish</title>
<!-- Fonts: Special Elite (typewriter) for the poem and title, Courier Prime for small labels. Both from Google Fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital@0;1&display=swap">
<style>
/* =====================================================================
   LOOK AND LAYOUT
   =====================================================================
   Layout: 22 slots across the top (the shelf). Below it, a square drawing panel
   on the left and the current lines of the poem on the right. */

/* ---------- Colours and fonts ----------
   Every colour is a name here, sampled from your animations, so you can retheme the
   whole site by changing these few lines. */
:root{
  color-scheme:dark;
  --ink:#0b101b;          /* deep navy, darker than the pictures */
  --panel:#192131;        /* the pictures' background */
  --bone:#dfe5f2;         /* pale slate, like the necklace and highlights */
  --lit:#f1f4fb;
  --dim:#6f7d9c;
  --faint:#9ca9c6;
  --blood:#b0222c;
  --edge:#33415e;         /* the skin's slate blue, darkened */
  --maroon:#2a0a10;       /* the dress */
  --type:'Special Elite','Courier New',Courier,monospace;   /* typewriter face, with Courier as a back-up */
  --ui:'Courier Prime','Courier New',Courier,monospace;
  --sq:clamp(260px,min(46vw,calc(100vh - 330px)),620px);    /* size of the square panel: grows with the screen, between 260 and 620 px */
}
*{box-sizing:border-box}
html{background:var(--ink)}
/* The page: navy with a faint maroon glow rising from the bottom (the dress colour) */
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 115%,var(--maroon) 0%,var(--ink) 62%) fixed,var(--ink);color:var(--bone);font:16px/1.4 var(--ui);padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
/* Anything with class "wob" gets the jiggle (the filter is defined in the SVG near the bottom of this file) */
.wob{filter:url(#wob)}

/* ---------- Header: title and the "0 of 22 drawn" counter ---------- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1240px;margin:0 auto 14px;position:relative;z-index:2}
h1{margin:0;font:400 clamp(34px,5vw,54px)/1 var(--type);letter-spacing:.02em}
h1 span{color:var(--blood)}   /* the "ish" in Vampirish is red */
.count{font:italic 15px var(--ui);color:var(--dim);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.count b{font:400 30px/1 var(--type);color:var(--bone)}
.again{font:italic 15px var(--ui);color:var(--bone);background:none;border:1px solid var(--edge);padding:3px 12px;cursor:pointer;border-radius:2px}
.again:hover{border-color:var(--blood)}
/* Keyboard focus ring (shown only when tabbing with a keyboard) */
button:focus-visible,.w:focus-visible{outline:2px dashed var(--blood);outline-offset:4px}

/* ---------- The shelf: a row of 22 slots along the top ---------- */
#shelf{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px;max-width:1040px;margin:0 auto 30px;position:relative;z-index:3}
/* An empty slot: a solid outline with its number */
.slot{position:relative;aspect-ratio:1;padding:0;margin:0;border:1px solid var(--edge);background:none;border-radius:2px;color:var(--dim);font:italic 13px var(--ui);cursor:default;transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .22s,border-color .22s}
.slot canvas{position:absolute;inset:0;width:100%;height:100%;display:none}   /* the little picture is hidden until the slot is filled */
/* A finished slot: shows its looping picture and can be clicked */
.slot.filled{border:1px solid #4a5a7c;background:var(--panel);cursor:pointer}
.slot.filled canvas{display:block}
.slot.filled .n{display:none}
/* Hover (or keyboard focus) on a finished slot: grows a little */
.slot.filled:hover,.slot.filled:focus-visible{transform:scale(1.16);z-index:6;box-shadow:0 8px 26px #000c;border-color:var(--bone);outline:none}

/* ---------- The stage: picture on the left, poem on the right ---------- */
.stage{display:grid;grid-template-columns:var(--sq) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;max-width:1240px;margin:0 auto;position:relative;z-index:2}
.panel{position:relative;width:var(--sq);aspect-ratio:1;max-width:100%;border:1px solid var(--edge);background:var(--panel);transition:box-shadow .25s,border-color .25s}
.panel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel.hot{border-color:var(--blood);box-shadow:0 0 0 3px #b0222c66,0 0 60px #b0222c55}   /* red glow while a word is held over the picture */
.panel.flash{animation:flash .9s ease-out}                                                  /* pale ripple when the right word lands */
@keyframes flash{0%{box-shadow:0 0 0 0 #dfe5f2}100%{box-shadow:0 0 0 44px #dfe5f200}}

/* ---------- The poem text ---------- */
.lines{font:400 clamp(20px,2.3vw,34px)/1.6 var(--type);min-width:0}
.lines.enter{animation:enter .6s ease-out}                  /* slides in when a new panel loads */
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.line{display:block}
.line.rest{padding-left:2ch}                                /* the revealed line is indented, like the continuation lines in the poem */
.line.rest .w{opacity:0;animation:wIn .6s ease-out forwards;animation-delay:calc(var(--k) * 170ms + .25s)}   /* each word fades in a beat after the last */
@keyframes wIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* A word you can drag: dim until hovered */
.w{display:inline-block;color:var(--dim);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-right:0;transition:color .2s,transform .2s}
.w:hover{color:var(--lit);transform:translateY(-2px)}
.w.lifted{opacity:.18}                                      /* the original word, faded while its copy is being dragged */
.w.hint{color:var(--lit);text-shadow:0 0 18px var(--blood)} /* glows after two wrong drops */
/* After the right word lands: everything turns bright and stops being draggable, the keyword is red */
.lines.done{color:var(--bone)}
.lines.done .w{color:var(--bone);cursor:default;transform:none}
.lines.done .w.key{color:var(--blood)}
.note{font:italic 16px var(--ui);color:var(--dim);margin:22px 0 0;transition:opacity .4s}   /* the "drag the word..." hint */
.ghost{position:fixed;z-index:50;pointer-events:none;font:400 1em/1.6 var(--type);color:var(--lit);-webkit-text-stroke-width:.7px;text-shadow:0 0 22px var(--blood);white-space:nowrap}   /* the copy of the word that follows your pointer */
.flyer{position:fixed;z-index:40;pointer-events:none;overflow:hidden;border:1px solid var(--edge);background:var(--panel)}   /* the picture flying up to the shelf */
.flyer canvas{width:100%;height:100%;display:block}
/* When every panel is finished: hide the big picture and centre the closing message */
.stage.over{grid-template-columns:minmax(0,1fr);text-align:center}
.stage.over .panel{display:none}

/* ---------- The floating words ----------
   Two layers cover the whole screen and let clicks pass through:
     #fx sits above the page (z-index 30): new words appear here and assemble into the line
     #bg sits behind the page (z-index 0): after the line lets go, the words move here and drift */
#bg,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg{z-index:0}
#fx{z-index:30}
/* .fw = a floating word. The typewriter font has one weight, so "bold" is done with a thin outline around the letters. */
.fw{position:absolute;left:0;top:0;font:400 1em/1 var(--type);white-space:nowrap;text-align:center;color:var(--lit);-webkit-text-stroke-width:.7px;opacity:1;will-change:transform;transition:color .9s,opacity .9s,-webkit-text-stroke-width .9s}
.fw.in{transition:none}                                                                       /* while flying in, the code sets opacity itself every frame */
.fw.dim{color:var(--faint);-webkit-text-stroke-width:0;opacity:.36}                           /* drifting: dim and thin */
.fw.dim.hov{color:var(--lit);-webkit-text-stroke-width:.9px;opacity:.95;transition-duration:.22s}   /* hovered: bright and bold */
.fw.gone,.fw.dim.gone{opacity:0;transition:opacity 1.1s}                                      /* removed: fades out */

/* ---------- Smaller screens ---------- */
@media (max-width:900px){#shelf{grid-template-columns:repeat(8,minmax(0,1fr))}}                                         /* fewer slots per row */
@media (max-width:760px){.stage{grid-template-columns:minmax(0,1fr);gap:22px}.panel{width:min(100%,460px);margin:0 auto}}   /* poem moves below the picture */
@media (max-width:540px){#shelf{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}}
/* If someone's device is set to "reduce motion": the jiggle stops changing and the flash/slide-in are off */
@media (prefers-reduced-motion:reduce){.wob{filter:url(#wobStill)}.panel.flash,.lines.enter{animation:none}}
/* make the HTML "hidden" attribute always win */
[hidden]{display:none!important}
</style>
</head>
<body>


<!-- THE JIGGLE
     An invisible SVG that defines two filters. "wob" is the handwritten/redrawn effect:
       1. feTurbulence makes a field of random noise.
       2. feDisplacementMap uses that noise to push every pixel of the text a tiny bit sideways and up/down.
       3. The <animate> line changes the noise's "seed" in steps (calcMode="discrete"): 8 different seeds
          over 2 seconds = 4 new wobbles a second, matching the 4 fps animations. Because it steps instead of
          sliding, the text looks redrawn each time. It works on any font.
     "wobStill" is the same with a fixed seed, used for people who asked for reduced motion. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wob" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;6;11;3;8;14;5;9" dur="2s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobStill" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- The two layers for the floating words (see the CSS above); the JavaScript fills them -->
<div id="bg"></div>
<div id="fx"></div>

<!-- Title and counter. The counter's total is filled in by the JavaScript from the poem list. -->
<header>
  <h1>Vampir<span>ish</span></h1>
  <div class="count"><b id="cnt">0</b> of <span id="tot"></span> drawn <button class="again" id="again" hidden>Begin again</button></div>
</header>

<!-- The shelf: the JavaScript creates one button per panel inside this -->
<nav id="shelf" aria-label="Finished panels"></nav>

<!-- The stage: the picture (a canvas the JavaScript draws on) and the poem text -->
<main class="stage" id="stage">
  <div class="panel" id="panel"><canvas id="cv" width="800" height="800" aria-label="Animation panel"></canvas></div>
  <div>
    <div class="lines wob" id="lines"></div>
    <p class="note" id="note">Drag the word that finishes the line onto the picture.</p>
  </div>
</main>

<!-- All the code below runs the page. It is made of four parts, in order:
       1. the poem list, 2. the frame list and timing, 3. the picture player, 4. the interaction. -->
<script>
/* =====================================================================
   VAMPIRISH: the poem and which picture goes with each part
   =====================================================================
   This is the only place you need to edit to change the words.

   Each panel is one entry in the list below:
     t    = the line(s) shown BEFORE the drag. Each string is one row of text.
     key  = the one word the reader must drag onto the picture
     rest = the line(s) that appear AFTER the right word is dropped (optional)
     anim = which animation plays (names come from ANIMS_RAW, just below this file)
            Panels you haven't drawn yet borrow 'prick' for now.

   The shelf size, the "0 of 22 drawn" counter and the ending all come from
   the length of this list, so adding or removing a panel just works. */

  { t:['My vitality and my fate'],        key:'vitality',rest:['With mortality and a taste'], anim:'blood' },
  { t:['Of death were gone'],             key:'gone',    rest:['like virgin glee'],           anim:'gone' },
  { t:['Like eyes of youth'],             key:'eyes',    rest:['lose purity'],                anim:'prick' },
  { t:['You held me'],                    key:'held',    rest:['as my skin grew pale'],       anim:'held' },
  { t:['I held my neck,'],                key:'neck',    rest:['where teeth impaled'],        anim:'neck' },

  // ----- panels 7-22: whole line(s) shown up front, borrowing the prick animation until drawn -----

  { t:['Your act of service, act of love'],            key:'love',       anim:'prick' },
  { t:['Act of saving by the Savior'],                 key:'Savior',     anim:'prick' },
  { t:['Fatal kiss, meant as a favor'],                key:'kiss',       anim:'prick' },
  { t:["Favored me, but who's this for?"],             key:'Favored',    anim:'prick' },
  { t:["You treat me like I'm keeping score"],         key:'score',      anim:'prick' },
  { t:["If all I am to you's a game,","A damsel in distress to save,"],  key:'game', anim:'prick' },
  { t:['Kill me now and end my life,','Save me from eternal strife'],    key:'Kill', anim:'prick' },
  { t:["But you won't, can't take the loss"],          key:'loss',       anim:'prick' },
  { t:["Can't commit if at your cost"],                key:'cost',       anim:'prick' },
  { t:['It matters not, the choice is made','That which I cannot evade'], key:'choice',     anim:'prick' },
  { t:['You have sent death far away','Expecting me to want to stay'],   key:'stay',       anim:'prick' },
  { t:["Now on loneliness you'll feed",'As your punishment for greed'],  key:'loneliness', anim:'prick' },
  { t:['For it takes a wooden stake','To overwrite your worst mistake'], key:'stake',      anim:'prick' },
  { t:['That fleeting moment, short-term bliss'],      key:'bliss',      anim:'prick' },
  { t:['That left us living vampirish.'],              key:'vampirish',  anim:'prick' },

const N = PANELS.length;   // number of panels (22)

/* =====================================================================
   PLAYING YOUR ANIMATIONS
   =====================================================================
   The pictures come from the build script (build_frames.py), which stacks
   your Procreate layers (background, base, frame, fg), crops them and saves
   one finished image per frame. This file only has to answer two questions:
     1. Which image should be showing right now?
     2. Draw it onto a canvas.
   Timing comes from ANIMS_RAW (4 fps): a list of [image number, milliseconds]. */

// Small shared helpers (also used by the floating-word code further down)
const TAU = Math.PI * 2;                 // a full circle in radians
const BG = '#192131';                    // the navy behind every picture
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);   // smooth start and stop, for 0..1
const c01 = x => x < 0 ? 0 : x > 1 ? 1 : x;                      // clamp a number to 0..1

// Load every frame image once, when the page opens
const IMGS = ANIM_FILES.map(f => { const im = new Image(); im.src = f; return im; });

// Turn each timing list into running totals, so we can look up a frame by time.
// Example: [[0,1000],[1,250]] becomes [{k:0,end:1000},{k:1,end:1250}] with total 1250.
const ANIM = {};
Object.entries(ANIMS_RAW).forEach(([name, seq]) => {
  let end = 0; const s = seq.map(([k, ms]) => ({ k, end: (end += ms) }));
  ANIM[name] = { seq: s, total: end };
});

// The animation that belongs to panel number i
const animOf = i => ANIM[PANELS[i].anim];

// Which image is showing `ms` milliseconds into the animation?
// The % (modulo) makes it loop forever: after the last frame it wraps back to the first.
function animIdx(A, ms) {
  const p = ((ms % A.total) + A.total) % A.total;
  for (const s of A.seq) if (p < s.end) return s.k;
  return A.seq[A.seq.length - 1].k;
}

// Draw panel i onto canvas context `c`.
//   size = canvas size in pixels, t = time in seconds,
//   mode = 0 (waiting for the drag: first frame, held still) or 1 (playing).
// Everything is drawn on a 1000 x 1000 grid and scaled to fit, so the same code
// fills the big panel (800 px) and the tiny shelf slots (160 px).
// Returns false if the image hasn't finished loading, so the caller can try again.
function drawPanel(c, size, i, t, mode) {
  const A = animOf(i), im = IMGS[mode ? animIdx(A, t * 1000) : A.seq[0].k];
  c.save(); c.setTransform(size / 1000, 0, 0, size / 1000, 0, 0);
  c.fillStyle = BG; c.fillRect(0, 0, 1000, 1000);
  const ok = im.complete && im.naturalWidth > 0;
  if (ok) { c.imageSmoothingQuality = 'high'; c.drawImage(im, 0, 0, 1000, 1000); }
  c.restore();
  return ok;
}
/* =====================================================================
   THE INTERACTION: dragging, the shelf, and the floating words
   =====================================================================
   Order of this file:
     1. Setup and the shelf
     2. Showing a panel's line(s)
     3. Dragging a word onto the picture
     4. Right/wrong answers, the story, and moving on to the shelf
     5. Clicking a finished panel: words come out and float around
     6. The animation loop that runs everything */

// ---------- 1. Setup ----------
const $ = s => document.querySelector(s);                  // shortcut: find one element
const norm = s => s.toLowerCase().replace(/[^a-z]/g, '');  // "Night," -> "night", so punctuation/caps don't matter
const stage = $('#stage'), panel = $('#panel'), cv = $('#cv'), lines = $('#lines'), note = $('#note');
const shelf = $('#shelf'), cnt = $('#cnt'), again = $('#again'), bg = $('#bg'), fx = $('#fx');
const sc = cv.getContext('2d');                            // the main panel's drawing surface
let cur = 0,            // which panel the reader is on (0 = first)
    mode = 'idle',      // 'idle' = waiting for the drag, 'story' = animation playing, 'over' = all done
    storyT0 = 0,        // the moment (seconds) the current story animation started
    misses = 0,         // wrong drops on this panel
    drag = null,        // the word being dragged right now, if any
    doneN = 0;          // how many panels are finished
const tf = (x, y, s = 1.06) => `translate(${x}px,${y}px) scale(${s})`;   // CSS move + scale, used for the dragged word

// Build the shelf: one button per panel. Each starts empty and disabled.
// Clicking a filled one sends its words out (see section 5).
const slots = [];
for (let i = 0; i < N; i++) {
  const b = document.createElement('button');
  b.className = 'slot'; b.disabled = true; b.setAttribute('aria-label', 'Panel ' + (i + 1));
  b.innerHTML = '<span class="n">' + (i + 1) + '</span><canvas width="160" height="160"></canvas>';
  b.addEventListener('click', () => exude(i, b));
  shelf.append(b);
  const k = b.querySelector('canvas');
  // on = finished? k = which frame is currently drawn there (-1 = none yet)
  slots.push({ b, c: k.getContext('2d'), on: false, k: -1 });
}

// ---------- 2. Showing a panel's line(s) ----------
// Put the panel's text on the right, one clickable <span> per word.
function loadPanel(i) {
  cur = i; mode = 'idle'; misses = 0;
  const P = PANELS[i];
  lines.textContent = '';
  P.t.forEach(txt => {
    const d = document.createElement('div'); d.className = 'line';
    txt.split(' ').forEach(wd => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = wd; s.tabIndex = 0;   // tabIndex lets keyboard users reach each word
      d.append(s, ' ');
    });
    lines.append(d);
  });
  lines.className = 'lines wob enter';                    // 'wob' = the jiggle, 'enter' = slide-in
  setTimeout(() => lines.classList.remove('enter'), 700);
  note.style.opacity = doneN < 3 ? 1 : 0;                 // the "drag the word..." hint only shows for the first few panels
}

// ---------- 3. Dragging a word ----------
// Pressing on a word: hide the original and make a floating copy ("ghost") that follows the pointer.
// Pointer events cover mouse, finger and pen with the same code.
lines.addEventListener('pointerdown', e => {
  const w = e.target.closest('.w');
  if (!w || mode !== 'idle' || drag) return;              // only words, only while waiting, only one at a time
  e.preventDefault();
  const r = w.getBoundingClientRect(), cs = getComputedStyle(w);
  const g = document.createElement('div');
  g.className = 'ghost wob'; g.textContent = w.textContent;
  Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', fontSize: cs.fontSize, transform: tf(0, 0) });
  document.body.append(g); w.classList.add('lifted');
  drag = { w, g, id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0, hot: false };
});
// Moving: slide the ghost, and check whether it is over the picture ("hot", with a 20 px margin).
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.sx; drag.dy = e.clientY - drag.sy;
  drag.g.style.transform = tf(drag.dx, drag.dy);
  const gr = drag.g.getBoundingClientRect(), pr = panel.getBoundingClientRect();
  const x = gr.left + gr.width / 2, y = gr.top + gr.height / 2;
  drag.hot = x > pr.left - 20 && x < pr.right + 20 && y > pr.top - 20 && y < pr.bottom + 20;
  panel.classList.toggle('hot', drag.hot);                // red glow around the picture
});
// Letting go: over the picture = check the answer; anywhere else = the word goes home.
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; panel.classList.remove('hot');
  if (d.hot && e.type === 'pointerup') attempt(d); else goHome(d);
};
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
// Keyboard alternative: focus a word and press Enter or Space to "drop" it.
lines.addEventListener('keydown', e => {
  const w = e.target.closest('.w');
  if (!w || mode !== 'idle' || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); attempt({ w, g: null, dx: 0, dy: 0 });
});

// ---------- 4. Right or wrong, the story, and moving on ----------
// Is the dropped word the keyword for this panel?
function attempt(d) { norm(d.w.textContent) === norm(PANELS[cur].key) ? success(d) : wrong(d); }

// The ghost slides back to where the word came from.
function goHome(d) {
  d.g.animate([{ transform: tf(d.dx, d.dy) }, { transform: tf(0, 0, 1) }], { duration: 320, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'forwards' })
    .onfinish = () => { d.g.remove(); d.w.classList.remove('lifted'); };
}

// Wrong word: shake, then go home. After two misses the right word glows as a hint.
function wrong(d) {
  misses++;
  if (misses >= 2) lines.querySelectorAll('.w').forEach(x => { if (norm(x.textContent) === norm(PANELS[cur].key)) x.classList.add('hint'); });
  const el = d.g || d.w;
  const a = el.animate([{ translate: '0 0' }, { translate: '-12px 0' }, { translate: '12px 0' }, { translate: '-8px 0' }, { translate: '0 0' }], { duration: 360 });
  a.onfinish = () => { if (d.g) goHome(d); };
}

// Right word: start the story.
function success(d) {
  mode = 'story'; storyT0 = performance.now() / 1000;    // the drawing loop (section 6) now plays the animation from this moment
  lines.classList.add('done');
  lines.querySelectorAll('.w').forEach(x => { x.classList.remove('lifted', 'hint'); x.removeAttribute('tabindex'); });
  d.w.classList.add('key');                               // the keyword turns red
  // Reveal the rest of the line, each word fading in a beat after the last (the --k number drives the delay in CSS)
  const rest = PANELS[cur].rest;
  if (rest) rest.forEach(txt => {
    const ln = document.createElement('div'); ln.className = 'line rest';
    txt.split(' ').forEach((wd, k) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = wd; s.style.setProperty('--k', k);
      ln.append(s, ' ');
    });
    lines.append(ln);
  });
  note.style.opacity = 0;
  panel.classList.remove('flash'); void panel.offsetWidth; panel.classList.add('flash');   // white ripple around the picture (the "void" line restarts the CSS animation)
  // The ghost word shrinks into the middle of the picture and disappears
  if (d.g) {
    const pr = panel.getBoundingClientRect(), gr = d.g.getBoundingClientRect();
    const ex = pr.left + pr.width / 2 - (gr.left + gr.width / 2), ey = pr.top + pr.height / 2 - (gr.top + gr.height / 2);
    d.g.animate([{ transform: tf(d.dx, d.dy), opacity: 1 }, { transform: tf(d.dx + ex, d.dy + ey, .15), opacity: 0 }], { duration: 420, easing: 'ease-in', fill: 'forwards' })
      .onfinish = () => d.g.remove();
  }
  // Let the story play for at least 4.8 s (or the animation's length + 2.2 s if that's longer), then move on
  const A = animOf(cur);
  setTimeout(toShelf, Math.max(4800, A ? A.total + 2200 : 0));
}

// Send the finished picture up to its slot on the shelf, then show the next panel.
function toShelf() {
  if (mode !== 'story') return;
  const i = cur, pr = panel.getBoundingClientRect(), sr = slots[i].b.getBoundingClientRect();
  // Copy the current picture into a "flyer" and fly it from the panel to the slot (850 ms)
  const fl = document.createElement('div'); fl.className = 'flyer';
  const cp = document.createElement('canvas'); cp.width = cp.height = 400;
  cp.getContext('2d').drawImage(cv, 0, 0, 400, 400); fl.append(cp);
  Object.assign(fl.style, { left: pr.left + 'px', top: pr.top + 'px', width: pr.width + 'px', height: pr.height + 'px', transformOrigin: '0 0' });
  document.body.append(fl);
  fl.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${sr.left - pr.left}px,${sr.top - pr.top}px) scale(${sr.width / pr.width})` }],
    { duration: 850, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'forwards' })
    .onfinish = () => { slots[i].on = true; slots[i].k = -1; slots[i].b.classList.add('filled'); slots[i].b.disabled = false; fl.remove(); };   // when it lands, the slot becomes live
  doneN++; cnt.textContent = doneN;
  if (i < N - 1) loadPanel(i + 1); else finale();
}

// After the last panel: show a closing message and the "Begin again" button.
function finale() {
  mode = 'over'; stage.classList.add('over');
  lines.className = 'lines done'; lines.textContent = 'Every panel is drawn. Click one to pull its lines out.';
  note.style.opacity = 0; again.hidden = false;
}

// "Begin again": clear the floating words and the shelf, and go back to panel 1.
again.addEventListener('click', () => {
  fadeBg(); doneN = 0; cnt.textContent = 0; again.hidden = true; stage.classList.remove('over');
  slots.forEach(s => { s.on = false; s.b.classList.remove('filled'); s.b.disabled = true; });
  loadPanel(0);
});

// ---------- 5. Clicking a finished panel: the floating words ----------
/* Click a finished panel: its words come out in reading order, hold together for a moment,
   then drift apart behind the page, bumping into walls and into each other.
   Clicking the same panel again fades its old words and sends out a fresh set in the same click.

   Each click creates a "group" (all the words of one panel). A group goes through three phases:
     'in'    each word flies from the shelf slot to its place in the line, one after another
     'hold'  the finished line sits together, bright, for 1.7 s
     'drift' the words move behind the page, dim, and wander, bouncing off walls and each other */
const groups = new Map();            // panel number -> its group of words
const bodies = [];                   // every word that is currently drifting (the ones that collide)
const HOLD = 1.7, DUR = 0.95, STAG = 0.15;   // hold time, each word's flight time, delay between words (seconds)
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);   // person asked their device for less motion
let mouse = null, hoverB = null;     // pointer position, and the word currently hovered

// Place a word on screen: position (its centre is b.x, b.y), tilt, and size.
function put(b, s = 1) {
  b.el.style.transform = `translate3d(${(b.x - b.w / 2).toFixed(1)}px,${(b.y - b.h / 2).toFixed(1)}px,0) rotate(${b.rot.toFixed(2)}deg) scale(${s})`;
}

// Pick where the assembled line should appear: try 60 random spots and keep the one that
// covers the big picture, the shelf and the poem text the least, so it stays readable.
function placeSpot(gw, gh) {
  const W = innerWidth, H = innerHeight, pad = 12;
  const avoid = [[panel, 1], [shelf, 1], [lines, .3]].map(([e, k]) => [e.getBoundingClientRect(), k]).filter(([r]) => r.width > 0);   // [thing to avoid, how much it matters]
  let best = { x: W / 2, y: H / 2 }, bo = Infinity;
  for (let k = 0; k < 60; k++) {
    const x = gw / 2 + 20 + Math.random() * Math.max(0, W - gw - 40), y = gh / 2 + 20 + Math.random() * Math.max(0, H - gh - 40);
    const L = x - gw / 2 - pad, R = x + gw / 2 + pad, T = y - gh / 2 - pad, B = y + gh / 2 + pad;
    let o = 0;   // how much this spot overlaps the things to avoid
    for (const [r, wt] of avoid) o += wt * Math.max(0, Math.min(R, r.right) - Math.max(L, r.left)) * Math.max(0, Math.min(B, r.bottom) - Math.max(T, r.top));
    if (o < bo) { bo = o; best = { x, y }; if (o === 0) break; }
  }
  return best;
}

// A shelf slot was clicked: make this panel's words.
function exude(i, slotEl) {
  if (!slots[i].on) return;
  if (groups.has(i)) removeGroup(i);                  // every click swaps this panel's old words for a fresh set
  const r = slotEl.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2, W = innerWidth;   // ox, oy = the slot's centre, where the words start
  let size = Math.max(17, Math.min(28, W * 0.0185)) * (0.92 + Math.random() * 0.16);   // font size: scales with screen width, a little random per click
  const G = { i, rows: [], all: [], phase: 'in', t0: performance.now() / 1000, ox, oy, cx: 0, cy: 0, tHold: 0 };
  // One element per word of the panel's full text (the lines before AND after the drag), kept in rows
  PANELS[i].t.concat(PANELS[i].rest || []).forEach(txt => {
    const row = txt.split(' ').map(wd => {
      const el = document.createElement('span');
      el.className = 'fw in wob'; el.textContent = wd; el.style.opacity = 0;
      fx.append(el);
      // Each word's "body": position (x,y), target spot (tx,ty), velocity (vx,vy), size (w,h), hitbox half-sizes (hw,hh), speed (s0), tilt (rot)
      const b = { el, g: G, x: ox, y: oy, tx: 0, ty: 0, vx: 0, vy: 0, w: 0, h: 0, hw: 0, hh: 0, s0: 0, rot: 0, rt: 0, t1: 0, idx: G.all.length, ph: 'in', ph0: Math.random() * TAU };
      G.all.push(b); return b;
    });
    G.rows.push(row);
  });
  /* measure each word and freeze its box, so hovering (bolder text) never changes a hitbox */
  const measure = () => {
    G.all.forEach(b => {
      const s = b.el.style; s.fontSize = size + 'px'; s.width = ''; s.height = '';
      b.w = b.el.offsetWidth + 2; b.h = b.el.offsetHeight || size;
      s.width = b.w + 'px'; s.height = b.h + 'px'; b.hw = b.w * .47; b.hh = b.h * .4;   // hitbox = 94% of the width, 80% of the height
    });
    const gap = size * .6; let gw = 0;     // typewriter-width gap between words; gw = width of the longest row
    G.rows.forEach(row => { gw = Math.max(gw, row.reduce((a, b) => a + b.w, 0) + gap * (row.length - 1)); });
    return { gap, lh: size * 1.4, gw };
  };
  let L = measure();
  if (L.gw > W - 40) { size *= (W - 40) / L.gw; L = measure(); }   // too wide for the screen: shrink to fit
  const c = placeSpot(L.gw, G.rows.length * L.lh);
  G.cx = c.x; G.cy = c.y;
  // Work out each word's resting place so the rows read as centred lines
  G.rows.forEach((row, rr) => {
    let x = -(row.reduce((a, b) => a + b.w, 0) + L.gap * (row.length - 1)) / 2;
    row.forEach(b => { b.tx = c.x + x + b.w / 2; b.ty = c.y + (rr - (G.rows.length - 1) / 2) * L.lh; x += b.w + L.gap; put(b, .3); });
  });
  groups.set(i, G);
}

// The held line lets go: move the words behind the page, dim them, and give each a push away from the line's centre.
function toDrift(G, now) {
  G.phase = 'drift';
  G.all.forEach(b => bg.append(b.el));                // move behind the page
  void bg.offsetWidth;                                // so the dimming below animates
  G.all.forEach(b => {
    b.el.classList.add('dim');
    const dx = b.x - G.cx, dy = b.y - G.cy;
    const a = Math.hypot(dx, dy) < 4 ? Math.random() * TAU : Math.atan2(dy, dx) + (Math.random() - .5) * 1.1;   // direction: outward from the centre, with some randomness
    b.s0 = (14 + Math.random() * 16) * (REDUCED ? .4 : 1);   // speed: 14-30 pixels a second (slower if reduced motion)
    b.vx = Math.cos(a) * b.s0; b.vy = Math.sin(a) * b.s0;
    b.rt = (Math.random() - .5) * 10; b.t1 = now; b.ph = 'drift';
    bodies.push(b);                                   // from now on it takes part in collisions
  });
}

// Fade a panel's words out and forget them.
function removeGroup(i) {
  const G = groups.get(i); if (!G) return;
  groups.delete(i);
  G.all.forEach(b => {
    const k = bodies.indexOf(b); if (k >= 0) bodies.splice(k, 1);
    if (hoverB === b) hoverB = null;
    b.ph = 'gone';
    b.el.classList.remove('hov', 'in'); b.el.style.opacity = '';
    b.el.classList.add('gone');                       // CSS fades it over about a second
    setTimeout(() => b.el.remove(), 1300);
  });
}
function fadeBg() { [...groups.keys()].forEach(removeGroup); }   // remove every panel's words (used by "Begin again")

// Track the mouse for the hover effect. The floating words sit behind the page, so the browser
// never tells them about the pointer; instead we remember where it is and test it ourselves.
// "blocked" = the pointer is over the picture, a shelf slot or a button, where a hidden word shouldn't react.
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const t = document.elementFromPoint ? document.elementFromPoint(e.clientX, e.clientY) : null;
  mouse = { x: e.clientX, y: e.clientY, blocked: !!(t && t.closest('.panel,.slot,.again,.w,.flyer')) };
});
document.documentElement.addEventListener('mouseleave', () => { mouse = null; });

// Runs every frame: moves the words. `now` = seconds, `dt` = seconds since the last frame.
function stepWords(now, dt) {
  /* appear in order, hold, then release */
  groups.forEach(G => {
    const age = now - G.t0;
    if (G.phase === 'in') {
      G.all.forEach(b => {
        const p = c01((age - b.idx * STAG) / DUR), e = ease(p);      // p = how far along this word's flight is (0..1); later words start later
        b.x = G.ox + (b.tx - G.ox) * e; b.y = G.oy + (b.ty - G.oy) * e;
        b.el.style.opacity = c01(p * 2); put(b, .3 + .7 * e);       // fade in while growing from small to full size
      });
      if (age > (G.all.length - 1) * STAG + DUR) {                  // last word has landed
        G.phase = 'hold'; G.tHold = now;
        G.all.forEach(b => { b.x = b.tx; b.y = b.ty; b.el.classList.remove('in'); b.el.style.opacity = ''; put(b); });
      }
    } else if (G.phase === 'hold' && now - G.tHold > HOLD) toDrift(G, now);
  });

  // --- Drifting: move each word and bounce it off the screen edges ---
  const W = innerWidth, H = innerHeight;
  for (const b of bodies) {
    const m = ease((now - b.t1) / 4);                 /* start from rest and speed up gently */
    const ang = (Math.random() - .5) * 1.4 * dt, ca = Math.cos(ang), sa = Math.sin(ang);    // a tiny random turn each frame, so paths curve
    const nvx = b.vx * ca - b.vy * sa; b.vy = b.vx * sa + b.vy * ca; b.vx = nvx;
    const sp = Math.hypot(b.vx, b.vy) || 1, k = 1 + (b.s0 / sp - 1) * Math.min(1, dt * .7);  // ease the speed back toward its own target (after a bump)
    b.vx *= k; b.vy *= k;
    b.x += b.vx * dt * m; b.y += b.vy * dt * m;
    const x0 = b.w / 2 + 6, x1 = W - b.w / 2 - 6, y0 = b.h / 2 + 6, y1 = H - b.h / 2 - 6;   // the allowed area, 6 px in from each edge
    if (x0 >= x1) b.x = W / 2; else if (b.x < x0) { b.x = x0; b.vx = Math.abs(b.vx); } else if (b.x > x1) { b.x = x1; b.vx = -Math.abs(b.vx); }
    if (y0 >= y1) b.y = H / 2; else if (b.y < y0) { b.y = y0; b.vy = Math.abs(b.vy); } else if (b.y > y1) { b.y = y1; b.vy = -Math.abs(b.vy); }
    b.rot = (b.rt + Math.sin(now * .4 + b.ph0) * 1.8) * m;       // a gentle sway
  }
  /* word against word: separate along the shallow axis and trade velocity along it */
  // Compare every pair. If two hitboxes overlap, push them apart along whichever direction overlaps least,
  // and swap their speeds in that direction (like two equal balls bumping).
  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    for (let j = i + 1; j < bodies.length; j++) {
      const b = bodies[j], dx = a.x - b.x, dy = a.y - b.y;
      const ox = a.hw + b.hw - Math.abs(dx), oy = a.hh + b.hh - Math.abs(dy);   // how much they overlap sideways / up-down
      if (ox <= 0 || oy <= 0) continue;                                          // not touching
      if (ox < oy) {
        const s = dx < 0 ? -1 : 1; a.x += s * ox / 2; b.x -= s * ox / 2;
        if ((a.vx - b.vx) * s < 0) { const v = a.vx; a.vx = b.vx; b.vx = v; }
      } else {
        const s = dy < 0 ? -1 : 1; a.y += s * oy / 2; b.y -= s * oy / 2;
        if ((a.vy - b.vy) * s < 0) { const v = a.vy; a.vy = b.vy; b.vy = v; }
      }
    }
  }
  /* hover: the word under the pointer turns bold and bright */
  let hit = null;
  if (mouse && !mouse.blocked && !drag) {
    let bd = 1e12;   // if several words are under the pointer, the one whose centre is nearest wins
    for (const b of bodies) {
      const dx = Math.abs(mouse.x - b.x), dy = Math.abs(mouse.y - b.y);
      if (dx <= b.w / 2 && dy <= b.h / 2 && dx * dx + dy * dy < bd) { bd = dx * dx + dy * dy; hit = b; }
    }
  }
  if (hit !== hoverB) {
    if (hoverB) hoverB.el.classList.remove('hov');
    if (hit) hit.el.classList.add('hov');             // CSS makes it bright and thick
    hoverB = hit;
  }
  for (const b of bodies) put(b);                     // finally, move every word on screen to its new position
}

// ---------- 6. The animation loop ----------
// Runs once per screen refresh (about 60 times a second). It does two jobs:
//   a) move the floating words,
//   b) show the right frame on the main panel and on each finished shelf slot.
// The pictures only change a few times a second (4 fps), so a canvas is redrawn only when its frame number changes.
let mainKey = '', lastNw = performance.now() / 1000;   // mainKey remembers "panel:frame" last drawn on the main panel
function tick(ms) {
  const nw = performance.now() / 1000; stepWords(nw, Math.min(.05, Math.max(0, nw - lastNw))); lastNw = nw;   // dt is capped so a long pause doesn't make words jump
  const t = ms / 1000;
  if (!document.hidden) {                                // don't draw while the tab is hidden
    if (mode !== 'over') {                             /* redraw only when the picture changes */
      const A = animOf(cur), story = mode === 'story', ts = story ? t - storyT0 : t;   // ts = seconds into the story
      const k = cur + ':' + (story ? animIdx(A, ts * 1000) : A.seq[0].k);
      if (k !== mainKey && drawPanel(sc, 800, cur, ts, story ? 1 : 0)) mainKey = k;
    }
    // Finished shelf slots loop their animation forever. Each is offset by 0.43 s per slot so they don't all move in sync.
    slots.forEach((s, i) => {
      if (!s.on) return;
      const ts = t + i * .43, k = animIdx(animOf(i), ts * 1000);
      if (k !== s.k && drawPanel(s.c, 160, i, ts, 1)) s.k = k;
    });
  }
  requestAnimationFrame(tick);
}
$('#tot').textContent = N;      // fill in "of 22 drawn"
loadPanel(0);                   // show the first panel
requestAnimationFrame(tick);    // start the loop
</script>

</body>
